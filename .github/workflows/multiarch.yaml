name: Docker Multiarch

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - images-multiarch.txt
      - .github/workflows/multiarch.yaml

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  copy:
    name: Copy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Copy multi-arch images to Aliyun
      run: |
        command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"
        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
          image=$(echo "$line" | awk '{print $NF}')
          image="${image%%@*}"
          new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${image##*/}"
          echo "copy $image -> $new_image"
          skopeo copy --all "docker://$image" "docker://$new_image"
        done < images-multiarch.txt
